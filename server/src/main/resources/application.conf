# https://www.playframework.com/documentation/latest/Configuration

# Swagger - be aware these are used at compile time
swagger {
  api {
    basePath = ""
    basePath = ${?SWAGGER_API_BASEPATH}

    info = {
      version = "beta"
      contact = "template@wiringbits.net"
      title = "Scala webapp template's API"
      description = "The API for the Scala webapp template app"
    }
  }
}

play.i18n.langs = ["en"]

play.filters.hosts {
  allowed = [host.docker.internal, "localhost", "localhost:9000", "127.0.0.1:9000"]
  allowed += ${?APP_ALLOWED_HOST_1}
  allowed += ${?APP_ALLOWED_HOST_2}
  allowed += ${?APP_ALLOWED_HOST_3}

}

play.http {
  # Important for production, it is used to sign sessions
  secret.key = "changeme"
  secret.key = ${?PLAY_APPLICATION_SECRET}

  errorHandler = "play.api.http.JsonHttpErrorHandler"

  session {
    cookieName = "__APP_SESSION__"

    # false by default because we use http locally, must be true in prod
    secure = false
    secure = ${?PLAY_SESSION_SECURE}

    # to secure the cookie, this value should be set in prod
    domain = null
    domain = ${?PLAY_SESSION_DOMAIN}

    # The session path
    # Must start with /.
    path = ${play.http.context}
    path = ${?PLAY_SESSION_DOMAIN_PATH}
  }
}

play.filters.disabled += "play.filters.csrf.CSRFFilter"
play.filters.enabled += "play.filters.cors.CORSFilter"

# Without this, CORS defaults to allowing every origin, and combined with
# supportsCredentials (also a Play default), any website can use a logged-in
# user's session cookie to call session-authenticated endpoints cross-origin,
# such as POST /users/mcp-token, and read the response.
play.filters.cors {
  allowedOrigins = [${webapp.host}]
  allowedOrigins += ${?APP_ALLOWED_ORIGIN_1}
  allowedOrigins += ${?APP_ALLOWED_ORIGIN_2}
  allowedOrigins += ${?APP_ALLOWED_ORIGIN_3}
}

# Allow up to 20 MB file uploads (default is 100 KB)
# TODO: replace with S3 presigned URL flow so the browser uploads directly to S3
#       and the server never buffers the file body at all.
play.http.parser.maxMemoryBuffer = 20m


db.default {
  driver = "org.postgresql.Driver"
  host = "localhost:5432"
  database = "wiringbits_db"
  username = "postgres"
  password = "postgres"

  host = ${?POSTGRES_HOST}
  database = ${?POSTGRES_DATABASE}
  username = ${?POSTGRES_USERNAME}
  password = ${?POSTGRES_PASSWORD}

  url = "jdbc:postgresql://"${db.default.host}"/"${db.default.database}
}

play.evolutions {
  autoApply = true

  db.default {
    enabled = true
    # Important because when this is false, failed migrations won't get to the play_evolutions table
    # preventing us to fix them manually
    autocommit = true
  }
}

# Number of database connections
# See https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing
fixedConnectionPool = 9

play.db {
  prototype {
    hikaricp.minimumIdle = ${fixedConnectionPool}
    hikaricp.maximumPoolSize = ${fixedConnectionPool}
  }
}

# Job queue sized to HikariCP connection pool
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = ${fixedConnectionPool}
  }
}

blocking.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    // very high bound to process lots of blocking operations concurrently
    fixed-pool-size = 5000
  }
}

play.modules.enabled += "net.wiringbits.modules.ApisModule"
play.modules.enabled += "net.wiringbits.modules.ConfigModule"
play.modules.enabled += "net.wiringbits.modules.ExecutorsModule"
play.modules.enabled += "net.wiringbits.modules.ClockModule"
play.modules.enabled += "net.wiringbits.modules.TasksModule"
play.modules.enabled += "net.wiringbits.modules.ServicesModule"

email {
  senderAddress = "replace@replace.net"
  senderAddress = ${?EMAIL_SENDER_ADDRESS}

  # defines the provider used to send emails, valid values being "aws" or "none"
  provider = "none"
  provider = ${?EMAIL_PROVIDER}
}

userTokens {
  hmacSecret = "REPLACE ME"
  hmacSecret = ${?USER_TOKENS_HMAC_SECRET}

  emailVerification {
    # expiration time for email verification
    expirationTime = "24 hours"
    expirationTime = ${?USER_TOKENS_EMAIL_VERIFICATION_EXPIRATION_TIME}
  }

  resetPassword {
    # expiration time for email reset password
    expirationTime = "24 hours"
    expirationTime = ${?USER_TOKENS_RESET_PASSWORD_EXPIRATION_TIME}
  }
}

textract {
  # "mock" uses MockTextractClient (no AWS calls); "real" calls AWS Textract AnalyzeExpense.
  # Default is "mock" so tests and uninitialised environments are safe.
  # Set TEXTRACT_MODE=real for local dev and prod.
  mode = "mock"
  mode = ${?TEXTRACT_MODE}
}

bedrock {
  # "mock" returns a hardcoded StatementMapping (no AWS calls); "real" calls AWS Bedrock Converse API.
  # Default is "mock" so tests and uninitialised environments are safe.
  # Set BEDROCK_MODE=real for local dev and prod.
  mode = "mock"
  mode = ${?BEDROCK_MODE}

  region = "us-east-1"
  region = ${?BEDROCK_REGION}

  accessKeyId = REPLACE_ME
  accessKeyId = ${?BEDROCK_ACCESS_KEY_ID}

  secretAccessKey = REPLACE_ME
  secretAccessKey = ${?BEDROCK_SECRET_ACCESS_KEY}

  # Amazon Nova Pro: available on-demand with no per-model access form, works via the Converse API, and reliably
  # produces the StatementMapping JSON. (The previous Anthropic model id is end-of-life, and current Anthropic models
  # need a `us.` inference-profile id plus a one-time use-case form on the account.)
  modelId = "amazon.nova-pro-v1:0"
  modelId = ${?BEDROCK_MODEL_ID}

  # Model used for direct bank-statement extraction (reads native text, returns transactions+metadata). Claude Sonnet
  # 4.5 proved reliable here (reconciles all sample statements); Haiku is cheaper but less reliable on dense credit
  # cards. Requires a `us.` inference-profile id and the model enabled in Bedrock Model access.
  statementModelId = "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
  statementModelId = ${?BEDROCK_STATEMENT_MODEL_ID}

  # Max output tokens for statement extraction. A large statement (hundreds of rows) produces a long JSON; too low a
  # cap truncates the response mid-array. Raise via env for unusually large statements (Sonnet 4.5 supports far more).
  statementMaxTokens = 16000
  statementMaxTokens = ${?BEDROCK_STATEMENT_MAX_TOKENS}

  # Amazon Nova Lite inference profile used for bank-statement row category/merchant suggestions (a short, cheap
  # classification prompt). An `eu.` profile is only invocable from an EU `bedrock.region` (e.g. eu-central-1); the
  # default region above is us-east-1, so set BEDROCK_REGION accordingly or override this with a `us.` profile.
  suggestionsModelId = "eu.amazon.nova-lite-v1:0"
  suggestionsModelId = ${?BEDROCK_SUGGESTIONS_MODEL_ID}
}

bda {
  # Amazon Bedrock Data Automation — used as an extraction fallback when the text rung doesn't reconcile.
  # "mock" uses MockBdaClient (no AWS calls); "real" calls BDA. Default "mock" so tests/uninitialised envs are safe.
  mode = "mock"
  mode = ${?BDA_MODE}

  # Data-automation profile ARN (account default), a project configured for standard markdown output, and the
  # bank-statement blueprint for custom output. Credentials/region come from the `aws { }` block.
  profileArn = "REPLACE_ME"
  profileArn = ${?BDA_PROFILE_ARN}

  standardProjectArn = "REPLACE_ME"
  standardProjectArn = ${?BDA_STANDARD_PROJECT_ARN}

  bankStatementBlueprintArn = "arn:aws:bedrock:us-east-1:aws:blueprint/bedrock-data-automation-public-bank-statement"
  bankStatementBlueprintArn = ${?BDA_BANK_STATEMENT_BLUEPRINT_ARN}

  # Where BDA writes its results (an S3 prefix the app can read).
  outputS3Uri = "REPLACE_ME"
  outputS3Uri = ${?BDA_OUTPUT_S3_URI}
}

aws {
  region = "us-west-2"
  region = ${?AWS_REGION}

  accessKeyId = REPLACE_ME
  accessKeyId = ${?AWS_ACCESS_KEY_ID}

  secretAccessKey = REPLACE_ME
  secretAccessKey = ${?AWS_SECRET_ACCESS_KEY}

  s3 {
    bucket = "replace-me-bucket"
    bucket = ${?AWS_S3_BUCKET}

    # Optional: set to override the S3 endpoint (e.g. localstack for tests)
    # endpointOverride = "http://localhost:4566"
    endpointOverride = ${?AWS_S3_ENDPOINT_OVERRIDE}
  }
}

webapp {
  host = "http://localhost:8080"
  host = ${?WEBAPP_HOST}
}

recaptcha {
  # secret key only used for test purposes
  secretKey = "6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe"
  secretKey = ${?RECAPTCHA_SECRET_KEY}
  siteKey = "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
  siteKey = ${?RECAPTCHA_SITE_KEY}
}

telegram {
  # Set to true to activate the webhook handler. Requires botToken and webhookSecret.
  enabled = false
  enabled = ${?TELEGRAM_ENABLED}

  # Bot token issued by @BotFather
  botToken = "REPLACE_ME"
  botToken = ${?TELEGRAM_BOT_TOKEN}

  # Random secret you choose; passed to setWebhook and verified on every inbound request
  webhookSecret = "REPLACE_ME"
  webhookSecret = ${?TELEGRAM_BOT_SECRET}

  botName = "REPLACE_ME"
  botName = ${?TELEGRAM_BOT_NAME}

  # NEVER set to true in production. When true, TelegramWebAppController accepts a
  # ?dev_user_id= query parameter to bypass Telegram WebApp auth for local development.
  webAppDevMode = false
  webAppDevMode = ${?TELEGRAM_WEB_APP_DEV_MODE}
}

backgroundJobsExecutorTask {
  # the task will run every time the period is fullfilled
  interval = 1 minutes
  interval = ${?NOTIFICATIONS_TASK_INTERVAL}
}
