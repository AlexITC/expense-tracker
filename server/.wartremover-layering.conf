# Layer DAG for the Layering wart (net.wiringbits.warts.Layering), server module only.
# Each layer lists in `calls` the layers it may reference; any other reference is flagged.
# `roots` are the packages this module governs; references outside them are ignored.
# A layer listing itself permits intra-layer (sibling) references.
roots = ["net.wiringbits", "controllers"]

layers = [
  # Entrypoints: invoked by the framework / DI / CLI, not by other layers.
  { name = routing,  packages = ["net.wiringbits.routing"], calls = [controllers, shared] }
  { name = modules,  packages = ["net.wiringbits.modules"], calls = [apis, services, shared, tasks] }
  { name = tasks,    packages = ["net.wiringbits.tasks"],   calls = [tasks, actions, apis, repositories, shared] }
  { name = scripts,  packages = ["net.wiringbits.scripts"], calls = [apis, daos, repositories, services, shared] }

  # Request tiers, top to bottom.
  { name = controllers,  packages = ["controllers"],                   calls = [mcp, actions, apis, shared] }
  { name = mcp,          packages = ["net.wiringbits.mcp"],            calls = [mcp, actions, shared] }
  { name = actions,      packages = ["net.wiringbits.actions"],        calls = [services, validations, repositories, apis, shared] }
  { name = validations,  packages = ["net.wiringbits.validations"],    calls = [services, repositories, apis, shared] }
  { name = services,     packages = ["net.wiringbits.services"],       calls = [services, repositories, apis, shared] }
  { name = apis,         packages = ["net.wiringbits.apis"],           calls = [apis, shared] }
  { name = repositories, packages = ["net.wiringbits.repositories"],   calls = [daos, shared] }
  { name = daos,         packages = ["net.wiringbits.repositories.daos"], calls = [shared] }

  # Shared leaf: data models, config, infra, lib/api + lib/common. May only reference itself.
  { name = shared, packages = [
      "net.wiringbits.repositories.models",
      "net.wiringbits.repositories.support",
      "net.wiringbits.models",
      "net.wiringbits.apis.models",
      "net.wiringbits.config",
      "net.wiringbits.executors",
      "net.wiringbits.util",
      "net.wiringbits.api",
      "net.wiringbits.common"
    ], calls = [shared] }
]

allowSameFileSiblings = true
