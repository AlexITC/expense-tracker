# Layer DAG for the Layering wart (net.wiringbits.warts.Layering), server module only.
# Each layer lists in `calls` the layers it may reference; any other reference is flagged.
# `roots` are the packages this module governs; references outside them are ignored.
#
# TARGET END-STATE. This is how the layering should look once the behavior-neutral
# refactors land (see docs/guide/architecture.md "refinements"): no self-edges on any
# behavioral layer, data models scoped to their users, entrypoints split into
# router/handlers to match HTTP. Until those code moves are in main and this branch
# rebases, this config FAILS to compile on purpose (mcp/tasks/apis still reference
# siblings; validations still reaches PasswordHasher in services on this branch).
# Pending code moves that turn it green:
#   - TextractClient result types -> apis.models            (drops apis self-edge)
#   - McpProtocol -> shared; McpTools -> net.wiringbits.mcp.tools (drops mcp self-edge)
#   - BackgroundJobTypeRunner -> net.wiringbits.tasks.runner (drops tasks self-edge)
#   - PasswordHasher -> util  (merged, PR #103; drops validations -> services on rebase)
roots = ["net.wiringbits", "controllers"]

layers = [
  # Entrypoints: invoked by the framework / DI / CLI. No self-edges: a router calls its
  # handlers (a separate layer), handlers never call siblings.
  { name = routing,   packages = ["net.wiringbits.routing"], calls = [controllers, shared] }
  { name = modules,   packages = ["net.wiringbits.modules"], calls = [apis, services, shared, tasks] }
  { name = tasks,     packages = ["net.wiringbits.tasks"],   calls = [jobrunner, repositories, apis, dbmodels, shared] }
  { name = jobrunner, packages = ["net.wiringbits.tasks.runner"], calls = [actions, apis, dbmodels, shared] }
  { name = scripts,   packages = ["net.wiringbits.scripts"], calls = [apis, daos, repositories, services, dbmodels, shared] }

  # Request tiers, top to bottom.
  { name = controllers, packages = ["controllers"],                 calls = [mcp, actions, apis, shared] }
  { name = mcp,         packages = ["net.wiringbits.mcp"],          calls = [mcptools, actions, shared] }
  { name = mcptools,    packages = ["net.wiringbits.mcp.tools"],    calls = [actions, dbmodels, shared] }
  { name = actions,     packages = ["net.wiringbits.actions"],      calls = [services, validations, repositories, apis, dbmodels, shared] }
  { name = validations, packages = ["net.wiringbits.validations"],  calls = [repositories, apis, dbmodels, shared] }
  { name = services,    packages = ["net.wiringbits.services"],     calls = [repositories, apis, dbmodels, clientmodels, shared] }
  { name = apis,        packages = ["net.wiringbits.apis"],         calls = [clientmodels, shared] }
  { name = repositories, packages = ["net.wiringbits.repositories"], calls = [daos, dbmodels, shared] }
  { name = daos,        packages = ["net.wiringbits.repositories.daos"], calls = [dbmodels, shared] }

  # Data leaves: scoped to the layers that use them. Self-edge = data composition
  # (one model referencing another), not behavior.
  { name = dbmodels, packages = [
      "net.wiringbits.repositories.models",
      "net.wiringbits.repositories.support"
    ], calls = [dbmodels, shared] }
  { name = clientmodels, packages = ["net.wiringbits.apis.models"], calls = [clientmodels, shared] }

  # Global leaf: usable everywhere. (Could later be grouped as one server package
  # net.wiringbits.shared.* plus the cross-compiled lib net.wiringbits.{api,common}.)
  { name = shared, packages = [
      "net.wiringbits.models",
      "net.wiringbits.config",
      "net.wiringbits.executors",
      "net.wiringbits.util",
      "net.wiringbits.api",
      "net.wiringbits.common"
    ], calls = [shared] }
]

allowSameFileSiblings = true
