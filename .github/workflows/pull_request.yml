name: Build the app

on:
  push:
    branches: [ main ]
    paths:
      - 'build.sbt'
      - 'project/**'
      - 'server/src/**'
      - 'web/src/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/pull_request.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'build.sbt'
      - 'project/**'
      - 'server/src/**'
      - 'web/src/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/pull_request.yml'

concurrency:
  # Only run once for latest commit per ref and cancel other (previous) runs.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # for checkout

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Install JDK 25 from GitHub's toolcache (not coursier). The Scala setup
      # below then uses this system JVM, so coursier never fetches its JVM index
      # (that fetch was flaky and failed the "Setup Scala" step before compile).
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Scala
        uses: japgolly/setup-everything-scala@v3.1
        with:
          java-version: 'system'
          node-version: '24'

      - name: Install yarn
        run: npm install -g yarn

      - name: Cache compiled code
        uses: actions/cache@v4
        with:
          path: |
            **/target/
            /home/runner/.ivy2/local
          key: compiled-code-cache-${{ hashFiles('**/build.sbt') }}
          restore-keys: compiled-code-cache-

      - name: Check code format
        run: sbt scalafmtCheckAll

      - name: Compile
        run: CI=true sbt Test/compile

      - name: Run tests
        run: CI=true sbt test

      - name: Test summary
        if: always() # Always run, even if previous steps failed
        uses: test-summary/action@v2
        with:
          paths: "**/target/test-reports/*.xml"

      - name: Test dev-web
        run: ./scripts/test-dev-web.sh

      - name: Prepare web build
        run: sbt web/build

      - name: Prepare server build
        run: sbt server/dist
